# Web UI, API and MCP server in Docker; the SQLite database stays on the host (./data/ossdex.db).
# Fill it on the host with the collector: `uv run --package ossdex-collector ossdex-collector update`
#   docker compose up -d --build        # http://localhost:8200  (MCP at /mcp)
services:
  server:
    build: .
    image: ossdex-server
    command: ossdex-server serve --host 0.0.0.0 --port 8200
    environment:
      OSSDEX_DB: /app/data/ossdex.db
      # Public domain for MCP (else /mcp rejects it with "Invalid Host"): OSSDEX_PUBLIC_HOST=ossdex.example.com docker compose up -d
      OSSDEX_PUBLIC_HOST: ${OSSDEX_PUBLIC_HOST:-}
    volumes:
      # Mount the directory, not the .db file: SQLite also creates ossdex.db-wal and -shm next to it.
      - ./data:/app/data
    ports:
      - "127.0.0.1:8200:8200"
    restart: unless-stopped
