[project]
name = "ossdex-server"
version = "0.1.0"
description = "Read-only web UI, API and MCP server over the ossdex database"
requires-python = ">=3.12"
dependencies = [
    "ossdex-core",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "mcp<2",
    "pydantic>=2.11",
    "typer>=0.15",
]

[tool.uv.sources]
ossdex-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
ossdex-server = "ossdex_server.cli:app"
